name: CI (Release)

on:
  push:
    branches: [main]
    tags: ['v*', 'release-test*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or replace; it must match SynergyStrapperVersion for a normal vX.Y.Z release'
        required: true
        default: 'v1.1.0'
        type: string
      source_ref:
        description: 'Branch or commit to build'
        required: true
        default: 'main'
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore SynergyStrapper/SynergyStrapper.csproj

      - name: Build
        run: dotnet build SynergyStrapper/SynergyStrapper.csproj -c Release --no-restore

      - name: Publish self-contained single-file executable
        run: dotnet publish SynergyStrapper/SynergyStrapper.csproj -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained true

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynergyStrapper-Release-${{ github.run_id }}
          path: SynergyStrapper/bin/Release/net6.0-windows/win-x64/publish/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/release-test') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: SynergyStrapper-Release-${{ github.run_id }}
          path: release

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release/SynergyStrapper.exe
          mv release/SynergyStrapper.exe SynergyStrapper.exe
          sha256sum SynergyStrapper.exe > SynergyStrapper.exe.sha256

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            prerelease="$INPUT_PRERELEASE"
          else
            tag="$REF_NAME"
            prerelease=false
            if [[ "$tag" == release-test* ]]; then
              prerelease=true
            fi
          fi

          if [[ ! "$tag" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|release-test[0-9A-Za-z.-]*)$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          if [[ "$tag" == v* ]]; then
            expected_version=$(sed -n 's:.*<SynergyStrapperVersion>\([^<]*\)</SynergyStrapperVersion>.*:\1:p' Directory.Build.props | tr -d '\r' | head -n 1)
            if [[ -z "$expected_version" || "$tag" != "v$expected_version" ]]; then
              echo "Release tag $tag does not match SynergyStrapperVersion ($expected_version)" >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create or replace published GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease="$PRERELEASE" \
              --title "Synergy Strapper $TAG"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Synergy Strapper $TAG" \
              --generate-notes \
              --prerelease="$PRERELEASE"
          fi

          gh release upload "$TAG" \
            SynergyStrapper.exe#SynergyStrapper.exe \
            SynergyStrapper.exe.sha256#SynergyStrapper.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
